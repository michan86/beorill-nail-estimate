<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beorill ネイル見積もり</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:sans-serif;
      background:#f7f3ef;
      color:#333;
    }

    .container{
      max-width:700px;
      margin:0 auto;
      padding:20px;
    }

    .title{
      text-align:center;
      margin:30px 0;
    }

    .title h1{
      margin:0;
      font-size:38px;
    }

    .title p{
      color:#777;
      margin-top:8px;
    }

    .card{
      background:#fff;
      border-radius:20px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    h2{
      margin-top:0;
      font-size:20px;
    }

    label{
      display:block;
      margin-top:15px;
      margin-bottom:5px;
      font-weight:bold;
    }

    select,input{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:16px;
    }

    .result{
      background:#333;
      color:#fff;
      border-radius:20px;
      padding:25px;
      position:sticky;
      bottom:0;
    }

    .price{
      font-size:38px;
      font-weight:bold;
      margin:10px 0;
    }

    .line-btn{
      display:block;
      width:100%;
      text-align:center;
      background:#06C755;
      color:#fff;
      text-decoration:none;
      padding:15px;
      border-radius:999px;
      margin-top:20px;
      font-weight:bold;
      font-size:16px;
    }

    .copy-btn{
      width:100%;
      border:none;
      padding:15px;
      border-radius:999px;
      margin-top:12px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .note{
      font-size:13px;
      color:#ddd;
      margin-top:15px;
      line-height:1.6;
    }

    .breakdown{
      background:rgba(255,255,255,0.1);
      padding:15px;
      border-radius:15px;
      margin-top:15px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      margin-bottom:8px;
    }

    .row:last-child{
      margin-bottom:0;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    <h1>Beorill</h1>
    <p>ネイル概算見積もり</p>
  </div>

  <div class="card">

    <h2>メニュー選択</h2>

    <label>メニュー</label>
    <select id="menu">
      <option value="5500">クリア ¥5,500</option>
      <option value="6000">ワンカラー ¥6,000</option>
      <option value="6800">マグネット・フラッシュ ¥6,800</option>
      <option value="6500">グラデーション ¥6,500</option>
      <option value="7500">ミラー ¥7,500</option>
      <option value="7800">ベイビーブーマー ¥7,800</option>
      <option value="8500">フレンチ ¥8,500</option>
      <option value="10700">フレンチ マグネット・フラッシュベース ¥10,700</option>
    </select>

    <label>ハンド・フット</label>
    <select id="foot">
      <option value="0">ハンド</option>
      <option value="1100">フット変更 +¥1,100</option>
    </select>

  </div>

  <div class="card">

    <h2>オプション</h2>

    <label>パラジェル変更</label>
    <select id="para">
      <option value="0">なし</option>
      <option value="1100">あり +¥1,100</option>
    </select>

    <label>マット・ハードトップ変更 本数</label>
    <input type="number" id="topCount" value="0" min="0" max="10">

    <label>長さ出し 本数</label>
    <input type="number" id="lengthCount" value="0" min="0" max="10">

    <label>亀裂補強 本数</label>
    <input type="number" id="repairCount" value="0" min="0" max="10">

  </div>

  <div class="card">

    <h2>オフについて</h2>

    <label>オフ選択</label>
    <select id="off">
      <option value="0">オフなし</option>
      <option value="0">ご新規様ハンドオフ ¥0</option>
      <option value="0">当店ハンドオフ30日以内 ¥0</option>
      <option value="1100">当店ハンドオフ31日以上 ¥1,100</option>
      <option value="1500">再来他店ハンドオフ ¥1,500</option>
      <option value="5000">当店オフのみ ¥5,000</option>
      <option value="1100">ご新規様フットオフ ¥1,100</option>
      <option value="550">当店フットオフ ¥550</option>
    </select>

  </div>

  <div class="result">

    <div>概算見積もり</div>

    <div class="price" id="total">¥0</div>

    <div class="breakdown" id="breakdown"></div>

    <div class="note">
      ※パーツ・特殊アート料金は含まれておりません。<br>
      デザイン画像確認後、正式なお見積もりをご案内いたします。
    </div>

    <button class="copy-btn" onclick="copyEstimate()">
      見積もり内容をコピー
    </button>

    <a class="line-btn" href="https://lin.ee/wYFjuCh" target="_blank">
      LINEで相談する
    </a>

  </div>

</div>

<script>

const menu = document.getElementById("menu");
const foot = document.getElementById("foot");
const para = document.getElementById("para");
const topCount = document.getElementById("topCount");
const lengthCount = document.getElementById("lengthCount");
const repairCount = document.getElementById("repairCount");
const off = document.getElementById("off");

const total = document.getElementById("total");
const breakdown = document.getElementById("breakdown");

const inputs = [
  menu,
  foot,
  para,
  topCount,
  lengthCount,
  repairCount,
  off
];

inputs.forEach(input=>{
  input.addEventListener("input",calculate);
});

function yen(num){
  return "¥" + Number(num).toLocaleString("ja-JP");
}

function calculate(){

  let totalPrice = 0;
  let rows = [];

  const menuPrice = Number(menu.value);
  totalPrice += menuPrice;
  rows.push(["メニュー",menuPrice]);

  const footPrice = Number(foot.value);
  totalPrice += footPrice;
  if(footPrice > 0){
    rows.push(["フット変更",footPrice]);
  }

  const paraPrice = Number(para.value);
  totalPrice += paraPrice;
  if(paraPrice > 0){
    rows.push(["パラジェル変更",paraPrice]);
  }

  const topPrice = Number(topCount.value) * 110;
  totalPrice += topPrice;
  if(topPrice > 0){
    rows.push([`マット変更 ${topCount.value}本`,topPrice]);
  }

  const lengthPrice = Number(lengthCount.value) * 660;
  totalPrice += lengthPrice;
  if(lengthPrice > 0){
    rows.push([`長さ出し ${lengthCount.value}本`,lengthPrice]);
  }

  const repairPrice = Number(repairCount.value) * 440;
  totalPrice += repairPrice;
  if(repairPrice > 0){
    rows.push([`亀裂補強 ${repairCount.value}本`,repairPrice]);
  }

  const offPrice = Number(off.value);
  totalPrice += offPrice;
  if(offPrice > 0){
    rows.push(["オフ料金",offPrice]);
  }

  total.innerText = yen(totalPrice);

  breakdown.innerHTML = "";

  rows.forEach(row=>{

    breakdown.innerHTML += `
      <div class="row">
        <span>${row[0]}</span>
        <span>${yen(row[1])}</span>
      </div>
    `;

  });

}

function copyEstimate(){

  calculate();

  const text =
`【Beorill ネイル概算見積もり】

合計：${total.innerText}

※パーツ・特殊アート料金は含まれておりません。
※正式なお見積もりは画像確認後となります。`;

  navigator.clipboard.writeText(text);

  alert("コピーしました！");

}

calculate();

</script>

</body>
</html>
