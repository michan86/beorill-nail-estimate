<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beorill ネイル見積もり</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "YuGothic", sans-serif;
      background: #f6f1ed;
      color: #333;
      line-height: 1.7;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .header {
      text-align: center;
      padding: 32px 16px 24px;
    }

    .shop-name {
      font-size: 38px;
      letter-spacing: 0.08em;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      margin: 0;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 15px;
      color: #777;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .section-title {
      font-size: 18px;
      margin: 0 0 14px;
      border-left: 4px solid #8c7b72;
      padding-left: 10px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 6px;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }

    .radio-group {
      display: grid;
      gap: 10px;
      margin-top: 8px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
      cursor: pointer;
    }

    .radio-item input {
      transform: scale(1.2);
    }

    .note {
      font-size: 13px;
      color: #777;
      margin-top: 8px;
    }

    .result-card {
      position: sticky;
      bottom: 0;
      background: #3f3a37;
      color: #fff;
      border-radius: 22px 22px 0 0;
      padding: 22px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18);
      margin: 24px -16px -80px;
    }

    .result-title {
      font-size: 15px;
      opacity: 0.85;
      margin: 0;
    }

    .price {
      font-size: 34px;
      font-weight: 700;
      margin: 6px 0 12px;
    }

    .breakdown {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      margin-top: 12px;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 0;
    }

    .breakdown-row:last-child {
      border-bottom: none;
    }

    .warning {
      font-size: 13px;
      color: #f5e5d8;
      margin: 14px 0 0;
    }

    .line-button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #06c755;
      color: #fff;
      border-radius: 999px;
      padding: 14px 16px;
      font-weight: 700;
      margin-top: 16px;
    }

    .copy-button {
      width: 100%;
      border: none;
      background: #fff;
      color: #3f3a37;
      border-radius: 999px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    .small-text {
      font-size: 12px;
      opacity: 0.8;
      text-align: center;
      margin-top: 8px;
    }

    @media (min-width: 768px) {
      .result-card {
        margin-left: 0;
        margin-right: 0;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="shop-name">Beorill</h1>
      <div class="subtitle">ネイル概算見積もり</div>
    </header>

    <section class="card">
      <h2 class="section-title">メニュー選択</h2>

      <label for="menu">ご希望のメニュー</label>
      <select id="menu">
        <option value="5500" data-name="クリア">クリア　¥5,500</option>
        <option value="6000" data-name="ワンカラー">ワンカラー　¥6,000</option>
        <option value="6800" data-name="マグネット・フラッシュ">マグネット・フラッシュ　¥6,800</option>
        <option value="6500" data-name="グラデーション">グラデーション　¥6,500</option>
        <option value="7500" data-name="ミラー">ミラー　¥7,500</option>
        <option value="7800" data-name="ベイビーブーマー">ベイビーブーマー　¥7,800</option>
        <option value="8500" data-name="フレンチ">フレンチ　¥8,500</option>
        <option value="10700" data-name="フレンチ マグネット・フラッシュベース">フレンチ マグネット・フラッシュベース　¥10,700</option>
      </select>

      <label>ハンド・フット</label>
      <div class="radio-group">
        <label class="radio-item">
          <input type="radio" name="foot" value="0" data-name="ハンド" checked />
          ハンド　追加なし
        </label>
        <label class="radio-item">
          <input type="radio" name="foot" value="1100" data-name="フット変更" />
          フット変更　+¥1,100
        </label>
      </div>
    </section>

    <section class="card">
      <h2 class="section-title">オプション</h2>

      <label for="para">パラジェル変更</label>
      <select id="para">
        <option value="0" data-name="なし">なし</option>
        <option value="1100" data-name="パラジェル変更">あり　+¥1,100</option>
      </select>

      <label for="top">マット・ハードトップ変更</label>
      <select id="top">
        <option value="0" data-name="なし">なし</option>
        <option value="110" data-name="マット・ハードトップ変更">あり　+¥110 / 本</option>
      </select>

      <label for="topCount">マット・ハードトップ変更の本数</label>
      <input id="topCount" type="number" min="0" max="10" value="0" />

      <label for="lengthCount">長さ出しの本数</label>
      <input id="lengthCount" type="number" min="0" max="10" value="0" />
      <div class="note">長さ出しは1本 ¥660です。</div>

      <label for="repairCount">亀裂補強の本数</label>
      <input id="repairCount" type="number" min="0" max="10" value="0" />
      <div class="note">亀裂補強は1本 ¥440です。</div>
    </section>

    <section class="card">
      <h2 class="section-title">オフについて</h2>

      <label for="off">オフの種類</label>
      <select id="off">
        <option value="0" data-name="オフなし">オフなし　¥0</option>
        <option value="0" data-name="ご新規様ハンドオフ">ご新規様ハンドオフ　¥0</option>
        <option value="0" data-name="当店ハンドオフ 30日以内">当店ハンドオフ 30日以内　¥0</option>
        <option value="1100" data-name="当店ハンドオフ 31日以上">当店ハンドオフ 31日以上　¥1,100</option>
        <option value="1500" data-name="再来他店ハンドオフ">再来他店ハンドオフ　¥1,500</option>
        <option value="5000" data-name="当店オフのみ">当店オフのみ　¥5,000</option>
        <option value="1100" data-name="ご新規様フットオフ">ご新規様フットオフ　¥1,100</option>
        <option value="550" data-name="当店フットオフ">当店フットオフ　¥550</option>
      </select>
      <div class="note">長さ出し・パーツ等がある場合は、別途料金がかかる場合があります。</div>
    </section>

    <section class="result-card">
      <p class="result-title">概算見積もり</p>
      <div class="price" id="totalPrice">¥0</div>

      <div class="breakdown" id="breakdown"></div>

      <p class="warning">
        ※パーツ・特殊アート料金は含まれておりません。<br />
        デザイン画像確認後、正式なお見積もりをご案内いたします。
      </p>

      <button class="copy-button" onclick="copyEstimate()">見積もり内容をコピーする</button>

      <!-- 公式LINEのURLを入れる場合は、下の # をLINEリンクに変更してください -->
      <a class="line-button" href="#" onclick="alert('ここに公式LINEのURLを設定してください'); return false;">
        LINEで相談する
      </a>
      <div class="small-text">コピーした内容をLINEに貼り付けて送信してください。</div>
    </section>
  </div>

  <script>
    const menu = document.getElementById("menu");
    const para = document.getElementById("para");
    const top = document.getElementById("top");
    const topCount = document.getElementById("topCount");
    const lengthCount = document.getElementById("lengthCount");
    const repairCount = document.getElementById("repairCount");
    const off = document.getElementById("off");
    const totalPrice = document.getElementById("totalPrice");
    const breakdown = document.getElementById("breakdown");

    const inputs = [menu, para, top, topCount, lengthCount, repairCount, off];
    inputs.forEach(input => input.addEventListener("input", calculate));
    document.querySelectorAll('input[name="foot"]').forEach(input => {
      input.addEventListener("change", calculate);
    });

    function yen(num) {
      return "¥" + Number(num).toLocaleString("ja-JP");
    }

    function selectedName(select) {
      return select.options[select.selectedIndex].dataset.name;
    }

    function selectedFoot() {
      return document.querySelector('input[name="foot"]:checked');
    }

    function clampCount(value) {
      const number = Number(value || 0);
      if (number < 0) return 0;
      if (number > 10) return 10;
      return number;
    }

    function calculate() {
      const rows = [];
      let total = 0;

      const menuPrice = Number(menu.value);
      total += menuPrice;
      rows.push({ name: selectedName(menu), price: menuPrice });

      const foot = selectedFoot();
      const footPrice = Number(foot.value);
      total += footPrice;
      if (footPrice > 0) rows.push({ name: foot.dataset.name, price: footPrice });

      const paraPrice = Number(para.value);
      total += paraPrice;
      if (paraPrice > 0) rows.push({ name: selectedName(para), price: paraPrice });

      const topUnit = Number(top.value);
      const topNum = clampCount(topCount.value);
      topCount.value = topNum;
      const topPrice = topUnit * topNum;
      total += topPrice;
      if (topPrice > 0) rows.push({ name: `マット・ハードトップ変更 ${topNum}本`, price: topPrice });

      const lengthNum = clampCount(lengthCount.value);
      lengthCount.value = lengthNum;
      const lengthPrice = lengthNum * 660;
      total += lengthPrice;
      if (lengthPrice > 0) rows.push({ name: `長さ出し ${lengthNum}本`, price: lengthPrice });

      const repairNum = clampCount(repairCount.value);
      repairCount.value = repairNum;
      const repairPrice = repairNum * 440;
      total += repairPrice;
      if (repairPrice > 0) rows.push({ name: `亀裂補強 ${repairNum}本`, price: repairPrice });

      const offPrice = Number(off.value);
      total += offPrice;
      if (selectedName(off) !== "オフなし" || offPrice > 0) {
        rows.push({ name: selectedName(off), price: offPrice });
      }

      totalPrice.textContent = yen(total);
      breakdown.innerHTML = rows.map(row => `
        <div class="breakdown-row">
          <span>${row.name}</span>
          <strong>${yen(row.price)}</strong>
        </div>
      `).join("");

      return { total, rows };
    }

    function copyEstimate() {
      const result = calculate();
      const text = `【Beorill ネイル概算見積もり】\n\n` +
        result.rows.map(row => `・${row.name}：${yen(row.price)}`).join("\n") +
        `\n\n合計：${yen(result.total)}\n\n` +
        `※パーツ・特殊アート料金は含まれておりません。\n` +
        `※デザイン画像確認後、正式なお見積もりをご案内いたします。`;

      navigator.clipboard.writeText(text).then(() => {
        alert("見積もり内容をコピーしました。LINEに貼り付けて送信してください。");
      }).catch(() => {
        alert("コピーできませんでした。画面の内容をスクリーンショットして送信してください。");
      });
    }

    calculate();
  </script>
</body>
</html>
